<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>2026 현장체험학습 - 청도코미디센터 - 체험활동 2026. 11. 5. 목요일</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F8;--card:#fff;--ink:#1C2340;--sub:#66708A;--line:#DCE1EC;--stage:#22306B;--spot:#FFC93C;--c:#22306B;--warn:#D64545}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151A2E;--card:#1E2540;--ink:#EDF0F8;--sub:#A3ABC4;--line:#323B5E;--stage:#2B3A7E}}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-tap-highlight-color:transparent;line-height:1.45}
button{font:inherit;color:inherit}
.ticket{margin:14px 16px 0;background:var(--stage);color:#fff;border-radius:18px;position:relative;overflow:hidden;display:flex}
.ticket::before,.ticket::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:var(--bg);right:97px}
.ticket::before{top:-11px}.ticket::after{bottom:-11px}
.t-main{flex:1;padding:16px 14px 14px 18px;min-width:0}
.t-year{font-size:13px;color:rgba(255,255,255,.75);margin:0 0 4px;font-weight:600}
.t-place{font-family:"Black Han Sans",Pretendard,sans-serif;font-size:clamp(25px,7.6vw,40px);line-height:1.08;margin:0;color:var(--spot);font-weight:400;word-break:keep-all}
.t-sub{margin:8px 0 0;font-size:13px;font-weight:600;color:rgba(255,255,255,.88)}
.t-stub{flex:0 0 108px;border-left:2px dashed rgba(255,255,255,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 6px;text-align:center}
.t-mon{font-size:12px;color:rgba(255,255,255,.75)}
.t-day{font-family:"Black Han Sans",sans-serif;font-size:44px;line-height:1;margin:2px 0}
.t-wd{font-size:13px;font-weight:700;color:var(--spot)}

.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 16px 10px;box-shadow:0 1px 0 var(--line)}
.grp{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--card);border-radius:12px;padding:4px;box-shadow:inset 0 0 0 1.5px var(--line)}
.grp button{border:0;background:none;border-radius:9px;padding:8px 4px;font-weight:700;font-size:15px;cursor:pointer}
.grp button small{font-weight:500;opacity:.7;margin-left:4px;font-size:12px}
.grp button.on{background:var(--stage);color:#fff}
.nav{display:grid;grid-template-columns:repeat(4,1fr);margin-top:8px;gap:2px}
.nav button{border:0;background:none;padding:7px 2px 8px;font-size:14px;font-weight:600;color:var(--sub);border-bottom:3px solid transparent;cursor:pointer}
.nav button.on{color:var(--ink);border-bottom-color:var(--spot)}
.search{margin-top:8px;display:flex;gap:8px}
input{flex:1;min-width:0;border:0;box-shadow:inset 0 0 0 1.5px var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px}
:focus-visible{outline:3px solid var(--spot);outline-offset:2px}

main{padding:14px 16px 30px;max-width:760px;margin:0 auto}
h2{font-size:20px;font-weight:800;margin:6px 2px 10px}
h2 small{font-size:13px;font-weight:600;color:var(--sub);margin-left:6px}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 0 var(--line)}
.muted{color:var(--sub);font-size:13px}
.kv{display:flex;gap:10px;font-size:14px;padding:3px 0}.kv b{flex:0 0 64px;color:var(--sub);font-weight:600}

/* 일정 */
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.tl li:first-child{border-top:0}
.tl .tm{flex:0 0 92px;font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;padding-top:1px}
.tl .ac{flex:1;font-size:15px;font-weight:600}
.tl .ac.mv{color:var(--sub);font-weight:500}
.tl .now .tm{color:var(--warn)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.split div{background:var(--bg);border-radius:8px;padding:6px 8px;font-size:14px}
.split small{display:block;font-size:12px;color:var(--sub);font-weight:600}
.link{border:0;background:var(--bg);border-radius:8px;padding:3px 9px;font-size:12px;font-weight:700;color:var(--stage);margin-left:6px;cursor:pointer;vertical-align:1px}
@media (prefers-color-scheme:dark){.link{color:var(--spot)}}
.duty h3{font-size:15px;margin:0 0 6px}
.duty ul{margin:0 0 10px;padding-left:18px;font-size:14px}.duty li{margin:2px 0}
.duty li.a{color:var(--warn)}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:6px 4px;text-align:center;border-top:1px solid var(--line)}
.tbl th{color:var(--sub);font-weight:600}
.tbl td.ab{color:var(--warn);font-size:12px}

/* 진로체험 출석 */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.tab{border:0;background:var(--card);border-radius:12px;padding:8px 6px 10px;cursor:pointer;text-align:left;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1.5px var(--line)}
.tab .nm{display:block;font-size:14px;font-weight:700;padding-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab .ct{display:block;font-size:12px;color:var(--sub);padding-left:4px;font-variant-numeric:tabular-nums}
.tab .pg{position:absolute;left:0;bottom:0;height:4px;background:var(--tc)}
.tab.on{background:var(--tc);color:#fff;box-shadow:none}.tab.on .ct{color:rgba(255,255,255,.85)}.tab.on .pg{background:rgba(255,255,255,.6)}
.head{display:flex;align-items:flex-end;justify-content:space-between;margin:2px 2px 8px}
.head h2{margin:0;color:var(--c)}
.score{font-variant-numeric:tabular-nums}.score b{font-size:28px;font-weight:800;color:var(--c);line-height:1}.score span{color:var(--sub);font-weight:600}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:12px}
.meter i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .25s}
.cls h3{margin:0 2px 8px;font-size:15px;display:flex;justify-content:space-between}
.cls h3 .n{font-size:12px;color:var(--sub);font-weight:600}
.cls.full h3 .n{color:var(--c);font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.st{border:0;background:var(--bg);border-radius:10px;padding:12px 4px;text-align:center;font-size:15px;font-weight:600;cursor:pointer;user-select:none;transition:background .15s,transform .1s}
.st:active,.rg:active{transform:scale(.97)}
.st.ok{background:var(--c);color:#fff}.st.ok::before{content:"✓";margin-right:3px}
.st.ab{background:none;box-shadow:inset 0 0 0 1.5px dashed var(--line);color:var(--sub);text-decoration:line-through;cursor:default}
.st small{display:block;font-size:11px;font-weight:500;opacity:.8;text-decoration:none}

/* 레일바이크 */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.rg{border:0;background:var(--card);border-radius:12px;padding:10px;text-align:left;cursor:pointer;box-shadow:0 1px 0 var(--line);transition:background .15s,transform .1s}
.rg .no{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.rg .no b{font-size:18px;font-weight:800}
.rg .no span{font-size:12px;color:var(--sub);font-weight:600}
.rg .ms{display:grid;grid-template-columns:1fr 1fr;gap:2px 6px;font-size:14px;font-weight:600}
.rg .ms .t{color:var(--sub);font-weight:500}
.rg .ms .x{color:var(--sub);text-decoration:line-through;font-weight:500}
.rg.ok{background:var(--stage);color:#fff}
.rg.ok .no span,.rg.ok .ms .t,.rg.ok .ms .x{color:rgba(255,255,255,.7)}
.rg.ok .no b::after{content:" ✓ 탑승";font-size:13px;color:var(--spot)}
.rg.hl{box-shadow:0 0 0 3px var(--spot)}

/* 연락망 */
.ct-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.ct-row:first-of-type{border-top:0}
.ct-row .who{flex:1;min-width:0}
.ct-row .who b{font-size:15px}
.ct-row .who span{display:block;font-size:12px;color:var(--sub)}
.call{flex:0 0 auto;text-decoration:none;background:var(--stage);color:#fff;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.call.sos{background:var(--warn)}

/* 검색 */
.hit{display:flex;gap:12px;align-items:flex-start}
.hit .nm{font-size:17px;font-weight:800;flex:0 0 auto}
.hit .nm small{display:block;font-size:12px;color:var(--sub);font-weight:600}
.hit .info{flex:1;font-size:14px}
.chip{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700;color:#fff;background:var(--c)}
.abtag{color:var(--warn);font-weight:700}

/* 잠금 */
.lock{max-width:420px;margin:24px auto;padding:0 16px;text-align:center}
.lock p{color:var(--sub);font-size:14px}
.lock form{display:flex;gap:8px;margin-top:10px}
.lock button{border:0;background:var(--stage);color:#fff;border-radius:12px;padding:0 16px;font-weight:700;cursor:pointer}
.err{color:var(--warn);font-size:13px;min-height:18px}
footer{color:var(--sub);font-size:12px;text-align:center;padding:4px 16px 28px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:640px){.tabs{grid-template-columns:repeat(6,1fr)}}
</style>
</head>

async function decrypt(code){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.s),iterations:P.it,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.i)},k,b64(P.d));
  return JSON.parse(new TextDecoder().decode(buf));
}
async function tryOpen(code,manual){
  if(!code)return;
  try{const D=await decrypt(code.trim());ls.set("code",code.trim());start(D)}
  catch(e){if(manual)$("err").textContent="코드가 맞지 않습니다. 카톡으로 받은 링크를 다시 눌러 보세요.";}
}
$("lf").addEventListener("submit",e=>{e.preventDefault();tryOpen($("code").value,true)});
if(!window.crypto||!crypto.subtle){$("err").textContent="이 화면에서는 열 수 없습니다. 크롬이나 사파리로 열어 주세요.";}
else tryOpen(decodeURIComponent(location.hash.slice(1))||ls.get("code",""),false);

let D,S;
const st={grp:ls.get("grp","A"),view:ls.get("view","plan"),prog:ls.get("prog","드론조종사"),chk:ls.get("chk",{}),rail:ls.get("rail",{}),hl:null};
const inGrp=(c,g)=>g==="A"?c<=5:c>=6;
const grpOf=c=>c<=5?"A":"B";
const sid=s=>s.c+"|"+s.n;

function start(data){
  D=data;S=D.students;
  $("lock").hidden=true;$("app").hidden=false;
  $("grp").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;st.grp=b.dataset.g;ls.set("grp",st.grp);go()});
  $("nav").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;st.view=b.dataset.v;ls.set("view",st.view);$("q").value="";go(true)});
  $("q").addEventListener("input",()=>render());
  $("main").addEventListener("click",onClick);
  go();
}
function go(top){render();if(top){const y=$("main").getBoundingClientRect().top+scrollY-document.querySelector(".bar").offsetHeight;if(scrollY>y)scrollTo(0,y)}}
function renderBar(){
  const a=S.filter(s=>s.c<=5&&!s.ab).length,b=S.filter(s=>s.c>=6&&!s.ab).length;
  $("grp").innerHTML=`<button data-g="A" class="${st.grp==="A"?"on":""}">A조<small>1~5반 ${a}명</small></button><button data-g="B" class="${st.grp==="B"?"on":""}">B조<small>6~11반 ${b}명</small></button>`;
  const V=[["plan","일정"],["prog","진로체험"],["rail","레일바이크"],["call","연락망"]];
  $("nav").innerHTML=V.map(([v,t])=>`<button data-v="${v}" class="${st.view===v?"on":""}">${t}</button>`).join("");
}
function render(){
  renderBar();
  const q=$("q").value.trim();
  $("main").innerHTML=q?viewSearch(q):({plan:viewPlan,prog:viewProg,rail:viewRail,call:viewCall}[st.view])();
}

function nowMin(){const d=new Date();return d.getFullYear()===2026&&d.getMonth()===10&&d.getDate()===5?d.getHours()*60+d.getMinutes():-1}
function rng(t){const m=t.match(/(\d+):(\d+)(?:–(\d+):(\d+))?/);const a=+m[1]*60+ +m[2];return[a,m[3]?+m[3]*60+ +m[4]:a+40]}
function viewPlan(){
  const g=st.grp,n=nowMin();
  let h=`<h2>${g}조 일정<small>${g==="A"?"1~5반":"6~11반"}</small></h2><div class="card"><div class="kv"><b>탑승 장소</b><span>${D.bus[g]}</span></div><div class="kv"><b>탑승</b><span>08:20까지 탑승 · 08:40 출발</span></div><div class="kv"><b>준비물</b><span>${D.prep}</span></div></div><div class="card"><ul class="tl">`;
  D.plan[g].forEach(r=>{
    const [a,b]=rng(r.t),now=n>=a&&n<b;
    let ac;
    if(r.split)ac=`<div class="split">${r.split.map(([c,p])=>`<div><small>${c}</small>${p}</div>`).join("")}</div>`;
    else ac=`<div class="ac${r.mv?" mv":""}">${r.a}${r.prog?`<button class="link" data-go="prog">출석부</button>`:""}${r.rail?`<button class="link" data-go="rail">탑승 조</button>`:""}</div>`;
    h+=`<li class="${now?"now":""}"><span class="tm">${r.t}</span>${r.split?`<div class="ac">${ac}</div>`:ac}</li>`;
  });
  h+=`</ul></div><h2>인솔 교사 할 일</h2><div class="card duty">`;
  D.duties.forEach(d=>{
    const items=(g==="A"?d.A.map(x=>`<li class="a">${x}</li>`):[]).concat(d.all.map(x=>`<li>${x}</li>`));
    h+=`<h3>${d.p}</h3><ul>${items.join("")}</ul>`;
  });
  h+=`${g==="A"?`<p class="muted" style="margin:0">빨간 항목은 A조만 합니다.</p>`:""}</div><h2>인솔 교사 중식</h2><div class="card">${D.lunch[g].map(([t,w,s])=>`<div class="kv"><b>${t}</b><span><strong>${w}</strong> · ${s}</span></div>`).join("")}</div>`;
  const cl=D.classes.filter(c=>inGrp(c[0],g));
  h+=`<h2>반별 참가 인원</h2><div class="card"><table class="tbl"><tr><th>반</th><th>재적</th><th>참가</th><th>불참 (번호)</th></tr>${cl.map(([c,e,j,a])=>`<tr><td>${c}반</td><td>${e}</td><td><b>${j}</b></td><td class="ab">${a||"–"}</td></tr>`).join("")}<tr><th>계</th><th>${cl.reduce((x,c)=>x+c[1],0)}</th><th>${cl.reduce((x,c)=>x+c[2],0)}</th><th></th></tr></table><p class="muted" style="margin:8px 0 0">1학년 전체 310명 중 304명 참가 · 1반 에벨리나 전출</p></div>`;
  return h;
}
function viewProg(){
  const g=st.grp,list=S.filter(s=>inGrp(s.c,g)),cur=st.prog;
  const cnt=p=>{const m=list.filter(s=>s.p===p&&!s.ab);return[m.filter(s=>st.chk[sid(s)]).length,m.length]};
  let h=`<div class="tabs">${D.progs.map(p=>{const[d,t]=cnt(p);return`<button class="tab ${p===cur?"on":""}" data-p="${p}" style="--tc:${COLORS[p]}"><span class="nm">${p}</span><span class="ct">${d} / ${t}</span><span class="pg" style="width:${d/t*100}%"></span></button>`}).join("")}</div>`;
  const[d,t]=cnt(cur),mine=list.filter(s=>s.p===cur);
  h+=`<div style="--c:${COLORS[cur]}"><div class="head"><div><h2>${cur}</h2><span class="muted">${g}조 · ${g==="A"?"10:00–11:30":"12:50–14:20"} · 정원 ${t}명</span></div><div class="score"><b>${d}</b><span> / ${t}</span></div></div><div class="meter"><i style="width:${d/t*100}%"></i></div>`;
  [...new Set(mine.map(s=>s.c))].forEach(c=>{
    const ms=mine.filter(s=>s.c===c),act=ms.filter(s=>!s.ab),cd=act.filter(s=>st.chk[sid(s)]).length,full=cd===act.length;
    h+=`<section class="card cls ${full?"full":""}"><h3><span>${c}반</span><span class="n">${full?"모두 출석 ":""}${cd} / ${act.length}</span></h3><div class="grid">${ms.map(s=>stBtn(s,false)).join("")}</div></section>`;
  });
  return h+`</div>`;
}
function stBtn(s,extra){
  if(s.ab)return`<span class="st ab">${s.n}<small>불참</small></span>`;
  const k=sid(s);
  return`<button class="st ${st.chk[k]?"ok":""}" data-s="${k}" style="--c:${COLORS[s.p]}" aria-pressed="${!!st.chk[k]}">${s.n}${extra?`<small>${s.c}반 ${s.p}</small>`:""}</button>`;
}
function viewRail(){
  const g=st.grp,gs=D.rail[g],key=r=>g+r.no;
  const done=gs.filter(r=>st.rail[key(r)]).length;
  let h=`<div class="head"><div><h2>레일바이크 4인 1조</h2><span class="muted">${g}조 ${g==="A"?"오후 13:10–14:40":"오전 09:40–11:10"} · 누르면 탑승 확인</span></div><div class="score" style="--c:var(--stage)"><b>${done}</b><span> / ${gs.length}조</span></div></div><div class="meter" style="--c:var(--stage)"><i style="width:${done/gs.length*100}%"></i></div><div class="rgrid">`;
  gs.forEach(r=>{
    const ms=r.m.map(m=>m.t?`<span class="t">${m.n==="선생님"?"선생님":m.n+" 선생님"}</span>`:m.ab?`<span class="x">${m.n}</span>`:`<span>${m.n}</span>`).join("");
    h+=`<button class="rg ${st.rail[key(r)]?"ok":""} ${st.hl===key(r)?"hl":""}" data-r="${key(r)}" id="r-${key(r)}"><div class="no"><b>${r.no==="번호없음"?"번호 미정":r.no+"조"}</b><span>${r.c}반</span></div><div class="ms">${ms}</div></button>`;
  });
  return h+`</div>${g==="A"?`<p class="muted">1반 박주영·송우섭은 원본 명단에 조 번호가 없습니다.</p>`:`<p class="muted">8조는 6반 2명 + 7반 2명이 함께 탑니다.</p>`}`;
}
function viewCall(){
  const row=c=>`<div class="ct-row"><div class="who"><b>${c[3]}</b><span>${c[1]} · ${c[2]}</span></div><a class="call ${c[0]==="E"?"sos":""}" href="tel:${c[4].replace(/-/g,"")}">${c[4]}</a></div>`;
  const sec=(g,t)=>`<h2>${t}</h2><div class="card">${D.contacts.filter(c=>c[0]===g).map(row).join("")}</div>`;
  const order=st.grp==="A"?[["A","A조 (1~5반)"],["B","B조 (6~11반)"]]:[["B","B조 (6~11반)"],["A","A조 (1~5반)"]];
  return sec("E","비상")+order.map(([g,t])=>sec(g,t)).join("");
}
function railOf(s){if(!s.r)return null;return{g:s.rg,no:s.r}}
function viewSearch(q){
  const ss=S.filter(s=>s.n.includes(q)),ts=D.contacts.filter(c=>c[3].includes(q));
  if(!ss.length&&!ts.length)return`<div class="card muted" style="text-align:center;padding:30px">'${q}' 이름이 명단에 없습니다. 글자를 확인해 주세요.</div>`;
  let h=`<h2>검색 결과<small>${ss.length+ts.length}명</small></h2>`;
  ss.forEach(s=>{
    const r=railOf(s),g=grpOf(s.c);
    h+=`<div class="card hit" style="--c:${COLORS[s.p]}"><div class="nm">${s.n}<small>${s.c}반 · ${g}조</small></div><div class="info">${s.ab?`<span class="abtag">불참</span><br>`:""}진로체험 <span class="chip">${s.p}</span><br>레일바이크 ${r?`<button class="link" style="margin:0" data-jump="${r.g+r.no}" data-g="${r.g}">${r.no==="번호없음"?"조 번호 미정":r.no+"조"} 보기</button>`:"–"}</div>${s.ab?"":`<button class="st ${st.chk[sid(s)]?"ok":""}" data-s="${sid(s)}" style="--c:${COLORS[s.p]};flex:0 0 76px;font-size:13px">${st.chk[sid(s)]?"출석":"체크"}</button>`}</div>`;
  });
  ts.forEach(c=>h+=`<div class="card"><div class="ct-row" style="border:0;padding:0"><div class="who"><b>${c[3]} 선생님</b><span>${c[0]==="E"?"":c[0]+"조 · "}${c[1]} · ${c[2]}</span></div><a class="call ${c[0]==="E"?"sos":""}" href="tel:${c[4].replace(/-/g,"")}">${c[4]}</a></div></div>`);
  return h;
}
function onClick(e){
  const s=e.target.closest("[data-s]"),r=e.target.closest("[data-r]"),p=e.target.closest("[data-p]"),gv=e.target.closest("[data-go]"),j=e.target.closest("[data-jump]");
  if(j){st.grp=j.dataset.g;st.view="rail";st.hl=j.dataset.jump;ls.set("grp",st.grp);ls.set("view","rail");$("q").value="";render();const el=$("r-"+st.hl);if(el)el.scrollIntoView({block:"center"});setTimeout(()=>{st.hl=null},100);return}
  if(gv){st.view=gv.dataset.go;ls.set("view",st.view);go(true);return}
  if(p){st.prog=p.dataset.p;ls.set("prog",st.prog);render();return}
  if(s){const k=s.dataset.s;st.chk[k]?delete st.chk[k]:st.chk[k]=1;ls.set("chk",st.chk);render();return}
  if(r){const k=r.dataset.r;st.rail[k]?delete st.rail[k]:st.rail[k]=1;ls.set("rail",st.rail);render();return}
}
</script>
</body>
</html>
